services:
  memorwise:
    build:
      context: ./Memorwise
    container_name: memorwise
    ports:
      - "4747:4747"
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - ORT_DISABLE_CUDA=1
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
